[project]
name = "photosearch"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
    "numpy>=2.5.4",
    "osxphotos>=0.77.2",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.1",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.19.0",
    "umap-learn>=0.5.12",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "websockets>=17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser'"
markers = ["browser: drives the web page in headless Chrome (slow; run with -m browser)"]
